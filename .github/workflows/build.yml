name: build
on:
  push:
  pull_request:
  release:
    types: [created]

jobs:
  # Fast feedback on the launcher and compiler: no game data needed.
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/compiler/Cargo.toml
      - run: cargo test --manifest-path rust/launcher/Cargo.toml
      - run: cargo build --release --manifest-path rust/compiler/Cargo.toml
      - run: cargo build --release --manifest-path rust/launcher/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: front-ends
          path: |
            rust/compiler/target/release/compiler.exe
            rust/compiler/target/release/compiler-tui.exe
            rust/launcher/target/release/DOA4Launcher.exe
            rust/launcher/target/release/DOA4Launcher-tui.exe

  # The release zip. It must contain rexgluerd.exe and its runtime DLLs, so the
  # SDK is built here; the game itself is not (that needs the player's dump).
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # rex_compute_version needs tags
      - uses: dtolnay/rust-toolchain@stable
      # choco is preinstalled on the Windows runners; avoids depending on a
      # third-party action for something this small.
      - run: choco install ninja -y --no-progress

      - name: Build the SDK (codegen tool + runtime DLLs)
        run: >
          cmake -S thirdparty/rexglue-sdk -B out/sdk -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          "-DCMAKE_C_FLAGS=-march=x86-64-v3" "-DCMAKE_CXX_FLAGS=-march=x86-64-v3"
          -DREXGLUE_BUILD_TESTS=OFF -DREXGLUE_ENABLE_TRACY=OFF
          -DREXGLUE_ENABLE_PERF_COUNTERS=OFF -DREXGLUE_ENABLE_FIDELITYFX=ON
          -DREXGLUE_DISABLE_VERSION_RESOURCE=ON
          -DREXGLUE_OUTPUT_DIR=${{ github.workspace }}/out/sdk/sdk-bin
      - run: cmake --build out/sdk

      - run: cargo build --release --manifest-path rust/compiler/Cargo.toml
      - run: cargo build --release --manifest-path rust/launcher/Cargo.toml

      - name: Package the release zip
        shell: pwsh
        run: ./tools/package_quiver.ps1 -SdkBin out/sdk/sdk-bin

      - uses: actions/upload-artifact@v4
        with: { name: DOA4-recomp-win-x64, path: publish/DOA4-recomp-win-x64.zip }

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: publish/DOA4-recomp-win-x64.zip
          token: ${{ secrets.GITHUB_TOKEN }}

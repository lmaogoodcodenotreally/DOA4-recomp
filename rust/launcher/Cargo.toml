[package]
name = "doa4-launcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "DOA4Launcher"
path = "src/bin/DOA4Launcher.rs"

[[bin]]
name = "DOA4Launcher-tui"
path = "src/bin/DOA4Launcher_tui.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
# Native file pickers for the ISO / exe / game-data paths.
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
